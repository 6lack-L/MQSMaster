name: Build and deploy MQSMaster to ECS

# Deploys to the ECS infrastructure defined in MUNQuantSociety/MQS_AWS_INFRA
# (terraform/environments/prod). Auth is GitHub OIDC -- the job assumes
# mqsmaster-prod-github-deploy via STS; no long-lived AWS keys are stored here.
#
# TRIGGER IS workflow_dispatch ONLY, deliberately. The `push: branches: [main]`
# trigger is added once a manual run has been verified end to end, so that
# enabling this workflow cannot deploy to prod on the merge commit itself.
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: livetradingbot
  ECS_CLUSTER: mqsmaster-prod-cluster
  MARKET_TASK_FAMILY: mqsmaster-prod
  MARKET_CONTAINER_NAME: mqsmaster
  NLP_TASK_FAMILY: mqsmaster-prod-nlp
  NLP_CONTAINER_NAME: mqsmaster-nlp
  NLP_SERVICE_NAME: mqsmaster-prod-nlp

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required to mint the GitHub OIDC token for AWS

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The deploy role trusts sub == repo:MUNQuantSociety/MQSMaster:ref:refs/heads/main.
      # Do NOT add a job-level `environment:` here -- that swaps the OIDC subject
      # claim to the environment form and STS will reject the assume-role call.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Tagged with the commit SHA only -- deliberately no `latest`. ECS resolves
      # a tag to a digest at task-launch time, so a `latest` reference would let
      # the scheduled market run pick up a different image each morning with no
      # deploy and no record of which build traded. The SHA tag is immutable and
      # traceable back to a commit. It also keeps this workflow correct whether
      # or not the ECR repository is set to IMMUTABLE tags -- that setting is not
      # managed by Terraform (the repo is adopted via a data source).
      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # --- Market task: register a new revision only. The EventBridge schedule
      # --- targets the family (unpinned revision), so the next scheduled run
      # --- picks up the new image on its own -- nothing to roll here.
      # describe-task-definition returns read-only fields that are not members of
      # the RegisterTaskDefinition input shape, and the render action does not
      # strip them -- it only swaps the image. Passing them to
      # `register-task-definition --cli-input-json` is a ParamValidationError,
      # so they are deleted here.
      - name: Download market task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${MARKET_TASK_FAMILY}" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)' \
            > market-task-def.json

      - name: Render market task definition
        id: render-market
        uses: aws-actions/amazon-ecs-render-task-definition@aae8639fd04a4d7a54efc92a2bdd638e81a1a7ca # v1.7.4
        with:
          task-definition: market-task-def.json
          container-name: ${{ env.MARKET_CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image_uri }}

      - name: Register market task revision
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-market.outputs.task-definition }} \
            > /dev/null
          echo "Registered new revision for ${MARKET_TASK_FAMILY}"

      # --- NLP service: register a new revision AND roll the service, since it
      # --- is always-on and will not otherwise pick up the image.
      # The deploy action below builds its register call from an allowlist and
      # would tolerate the read-only fields, but they are stripped here too so
      # both paths behave identically.
      - name: Download NLP task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${NLP_TASK_FAMILY}" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)' \
            > nlp-task-def.json

      - name: Render NLP task definition
        id: render-nlp
        uses: aws-actions/amazon-ecs-render-task-definition@aae8639fd04a4d7a54efc92a2bdd638e81a1a7ca # v1.7.4
        with:
          task-definition: nlp-task-def.json
          container-name: ${{ env.NLP_CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image_uri }}

      - name: Deploy NLP service
        uses: aws-actions/amazon-ecs-deploy-task-definition@c9aca01f61be59033b76dcb0a195081bf39dd434 # v2.3.4
        with:
          task-definition: ${{ steps.render-nlp.outputs.task-definition }}
          service: ${{ env.NLP_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: echo "Deployed image ${{ steps.build.outputs.image_uri }}"
